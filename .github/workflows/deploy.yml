name: Deploy ke Cloudflare Workers

# Auto-deploy setiap ada push/commit ke branch main -- push lewat GitHub web
# (upload file / commit langsung di browser) sudah cukup, tidak perlu CLI apa pun
# di sisi Anda. GitHub Actions yang menjalankan build & deploy di server GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & deploy ke Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          preCommands: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Dipisah jadi step tersendiri, DIJALANKAN SETELAH deploy di atas --
      # "wrangler secret put" mengharuskan Worker-nya sudah ada di Cloudflare.
      # Kalau digabung dalam satu step (secret push sebelum deploy pertama),
      # akan gagal karena Worker belum pernah dibuat. Aman dijalankan berkali-kali
      # (idempotent) -- secret langsung aktif tanpa perlu deploy ulang.
      - name: Push secrets server-only ke Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            B2_REGION
            B2_ENDPOINT
            B2_KEY_ID
            B2_APPLICATION_KEY
            B2_BUCKET_NAME
            B2_PUBLIC_URL
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_PUBLIC_URL: ${{ secrets.B2_PUBLIC_URL }}

